# Klartext für die Testdaten — was die Codes im Testdaten-Export bedeuten.
#
# Diese Datei ist der Standard, den das Panel "Testdaten" lädt, wenn die
# Umgebungsvariable ING_TESTDATA_LABELS NICHT gesetzt ist. Ist sie gesetzt, wird die
# dortige Datei ZUSÄTZLICH geladen und überschreibt einzelne Einträge — man kann also
# ergänzen, ohne alles Übrige zu verlieren.
#
# Format:  <Spaltenname>.<Wert> = Klartext      -> die Tabelle zeigt "Klartext (Wert)"
#          _spalte.<Spaltenname> = Klartext     -> beschriftet die Spalte selbst
#
# ACHTUNG, Java-Eigenheit: In .properties-Dateien trennt ein Leerzeichen den
# Schlüssel vom Wert. Leerzeichen IM Spaltennamen müssen deshalb mit einem
# Backslash geschrieben werden:  Verf\ Bez.INTB=Internetbanking
# Ohne den Backslash wird die Zeile still ignoriert — genau das ist beim ersten
# Versuch passiert, und es fällt nur auf, wenn man die Tabelle wirklich ansieht.
#
# Die Datei enthält KEINE Kundendaten — nur Spalte, Code und Bedeutung.
#
# ---------------------------------------------------------------------------------
# WOHER DIE BEDEUTUNGEN STAMMEN — und warum unten so vieles auskommentiert ist
# ---------------------------------------------------------------------------------
# Ein falsches deutsches Label ist schlimmer als ein roher Code: den rohen Code fragt
# man nach, das falsche Label glaubt man. Deshalb steht hier nur, was belegt ist:
#
#   [René]       wörtlich von der Testautomatisierung bestätigt
#   [Doku]       in unserer Dokumentation festgehalten
#   [gemessen]   aus dem Export selbst abgeleitet, ausnahmslos über alle Zeilen
#   [Konvention] J/N = ja/nein
#
# Alles Übrige steht als auskommentierte Zeile da. Diese Codes sind offen und liegen
# René als Frage vor:
# https://github.com/Wladefant/ing-qa-automation/blob/main/docs/meetings/RENE-QUESTIONS-2026-07-22.md
# Wer eine Bedeutung kennt: Kommentarzeichen entfernen, Bedeutung hinter das
# Gleichheitszeichen schreiben, fertig.
#
# Gemessen am 2026-07-28 gegen 20260430_Testdaten.xlsx, Blätter BON_KUNDE (50.015
# Zeilen), GIROKONTO (5.253) und KND_OHNE_BON (16.491) — mit dem korrigierten
# Konverter; alle Zeilen gleich breit, keine einzige unvollständig.


# =================================================================================
# Spaltenüberschriften
# =================================================================================
_spalte.Part\ Partnertyp\ Kz=Kundenart
_spalte.Partnertyp\ Kz=Kundenart
_spalte.PARTNERTYP=Kundenart
_spalte.Produktvariante\ Pzm=Produkt
_spalte.Produktvariante=Produkt
_spalte.Kbo5\ Bonitaet\ S=Bonität (Code)
_spalte.Kbo5\ Zusatzinfo=Bonität: Zusatzinfo
_spalte.Kbo5\ Personen\ Nr=Personennummer
_spalte.Part\ Nr=Partnernummer
_spalte.Partnernummer=Partnernummer
_spalte.Part\ Geburtsdatum=Geburtsdatum
_spalte.Legi\ Status\ Kz=Legitimationsstatus (Code)
_spalte.MDJ_KND=Minderjährig
_spalte.MDJ_KTO=Minderjährig
_spalte.MDJ_KND_OHNE_BON=Minderjährig
_spalte.MDJ=Minderjährig
_spalte.Vest\ Bez=Status des Zugangs
_spalte.VEST_BEZ=Status des Zugangs
# [gemessen] Verf Bez sagt, auf welches Zugangsverfahren sich "Status des Zugangs"
# bezieht: INTB-Zeilen tragen ausnahmslos einen Internetbanking-Status, PBTN-Zeilen
# ausnahmslos einen Postbox-Status — 71.759 von 71.759 Zeilen, keine Ausnahme.
_spalte.Verf\ Bez=Zugangsverfahren
_spalte.VERF_BEZ=Zugangsverfahren
# Bedeutung offen — die Überschrift sagt das lieber, als etwas zu behaupten.
_spalte.EZB=EZB (Bedeutung offen)
_spalte.Hogs\ Bez=Hogs Bez (Bedeutung offen)
_spalte.ZUDA\ APP=ZUDA APP (Bedeutung offen)
_spalte.ZUDA\ M_TAN=ZUDA M_TAN (Bedeutung offen)
_spalte.ZUDA\ TAN_LISTE=ZUDA TAN_LISTE (Bedeutung offen)


